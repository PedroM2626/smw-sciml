# Documentation site: build the mkdocs-material site and publish it on GitHub Pages.
#
# The research document lives in docs/paper/, one page per section, and the CI gates read
# those same files (src/utils/document.py). The site renders them through MathJax, so there is
# no second copy to drift; scripts/mkdocs_hooks.py re-points their repository links for the site.

name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the docs toolchain
        run: pip install -r docs/requirements-docs.txt
      - name: Build
        run: mkdocs build --strict
      # The pages link figures as ../results/figures/... once the hook has run; with
      # use_directory_urls: false that resolves from the site root, so the figures
      # directory is copied into the build to make the pages' images load.
      - name: Copy the figures the pages link
        run: |
          mkdir -p site/results
          cp -r results/figures site/results/figures
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
