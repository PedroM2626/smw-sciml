# Documentation site: the research document, one page per section, rendered with MathJax.
#
# The document lives in docs/paper/ (one page per section, one per study section 10.N), which is
# also what GitHub shows; the README is a short landing page that links into it. Splitting the
# document is what keeps every page under GitHub's math budget (roughly 1,368 expressions per page,
# measured in Section 12); the site renders the same files through MathJax, which has no budget.
# scripts/mkdocs_hooks.py re-points the pages' repository-relative links for the site, and
# tests/test_readme_math_rendering.py keeps the nav below listing every page.
#
# Local serving:
#   pip install -r docs/requirements-docs.txt
#   mkdocs serve

site_name: smw-pinn
site_description: >-
  Physics-Informed Neural Networks vs. Statistical Models in Super Mario World:
  discrete dynamics modeling from genuine WRAM telemetry, with closed-loop control
  on a real SNES.
site_url: https://pedrom2626.github.io/smw-sciml/
repo_url: https://github.com/PedroM2626/smw-sciml
repo_name: PedroM2626/smw-sciml

# Pages live at the site root (index.html, full-readme.html) so the README's relative
# links to results/figures/... resolve; the docs workflow copies that directory into
# the built site for the same reason.
use_directory_urls: false

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.sections
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

# The pages link to repository paths (results/..., src/...) that are not pages of this
# site; the hook turns them into GitHub links and only the figures directory is copied into
# the build. Anchors are computed differently by GitHub and by the toc extension, so they
# are not validated here - tests/test_readme_math_rendering.py checks them the way GitHub
# reads them. (Schema of the pinned mkdocs 1.6 line: anchors is a string inside links.)
validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
    anchors: ignore

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - scripts/mkdocs_hooks.py

