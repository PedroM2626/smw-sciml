# Documentation site: the full README rendered without GitHub's math budget.
#
# GitHub fails every math expression after roughly the first 1,368 of them (README
# section 12 measured the limit on this repository), so the document you are reading
# there stops rendering halfway through section 10.5x no matter how valid the LaTeX
# is. This site renders the same file through MathJax, which has no such budget.
#
# The README stays the single source of truth: docs/full-readme.md is generated from
# it by scripts/sync_docs.py (run by the docs workflow before every build, and by
# hand for local serving). Never edit the generated copy.
#
# Local serving:
#   pip install -r docs/requirements-docs.txt
#   python scripts/sync_docs.py
#   mkdocs serve

site_name: smw-pinn
site_description: >-
  Physics-Informed Neural Networks vs. Statistical Models in Super Mario World:
  discrete dynamics modeling from genuine WRAM telemetry, with closed-loop control
  on a real SNES.
site_url: https://pedrom2626.github.io/smw-sciml/
repo_url: https://github.com/PedroM2626/smw-sciml
repo_name: PedroM2626/smw-sciml

# Pages live at the site root (index.html, full-readme.html) so the README's relative
# links to results/figures/... resolve; the docs workflow copies that directory into
# the built site for the same reason.
use_directory_urls: false

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.sections
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

# The README links to repository paths (results/..., src/...) that are not pages of
# this site; only the figures directory is copied into the build. Reporting the rest
# as warnings would fail the strict build, so they are silenced deliberately: the
# canonical links live in the GitHub rendering, which this site supplements. (Schema
# of the pinned mkdocs 1.6 line: anchors is a string inside links.)
validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
    anchors: ignore

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Full README (MathJax, no budget): full-readme.md
